services:
  infectio:
    build: .
    container_name: infectio-pipeline
    working_dir: /app
    volumes:
      # Mount project root for source code and data
      - ..:/app
      # Mount user home for Desktop access
      - ~/:/home/user
      # Mount outputs to Desktop
      - ~/Desktop/infectio_outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Email for NCBI/Entrez API (optional, set if needed)
      - ENTREZ_EMAIL=sebbahaya03@gmail.com
    stdin_open: true
    tty: true
    command: python -i
    # Uncomment and modify to run specific scripts:
    # command: python src/Biomodels/biomodels_pipeline.py
    # command: python src/NCBI/ncbi_extraction.py
    # command: python src/Database/database_creation.py
